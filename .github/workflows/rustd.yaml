# rustd: the daemon's own checks, on its branches. The harnesses compare what rustd builds
# with what rustc builds, under both producers.
name: rustd
on:
  push:
    branches: ["rustd-*"]
  workflow_dispatch:

concurrency:
  group: rustd-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  LLVM_SYS_201_PREFIX: /usr/lib/llvm-20

jobs:
  checks:
    name: fmt and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c rust-src && rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --release -p hir-ty -p hir-def -p parser -p syntax -p rustd

  harness:
    name: harness (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    env:
      RUSTD_BACKEND: ${{ matrix.backend }}
      RUSTD_OPT: 2
      RUSTD_EMIT: fast
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.99.0 --profile minimal -c rust-src && rustup default 1.99.0 && rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-musl
      - name: LLVM 20
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y llvm-20-dev libpolly-20-dev valgrind gdb gcc-aarch64-linux-gnu musl-tools qemu-user
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rustd --release --features llvm
      - name: Harnesses
        working-directory: harness
        run: |
          export RUSTD_BIN="$GITHUB_WORKSPACE/target/release/rustd"
          failed=
          run() { echo "::group::$*"; python3 "$@" || { failed="$failed [$*]"; echo "::error::$* failed"; }; echo "::endgroup::"; }
          run difftest.py corpus --bin runner --crate cases --layouts
          run programs.py
          run stress.py
          run breakers.py
          run unwinds.py
          run splices.py
          run asmedits.py
          run includes.py
          run worktrees.py
          run keys.py
          run debuginfo.py
          if [ "${RUSTD_BACKEND:-cranelift}" = cranelift ]; then run buildmodel.py; fi
          run storekills.py --kills 100
          run storecorrupts.py --rounds 4
          run storefull.py
          run storeshared.py
          echo "failed:${failed:- none}"
          test -z "$failed"

  macos:
    name: macOS arm64 (${{ matrix.backend }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    env:
      RUSTD_BACKEND: ${{ matrix.backend }}
      RUSTD_OPT: 2
      RUSTD_EMIT: fast
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c rust-src && rustup default 1.99.0
      - name: LLVM 20
        run: |
          brew install llvm@20
          echo "LLVM_SYS_201_PREFIX=$(brew --prefix llvm@20)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
        if: matrix.backend == 'cranelift'
      - run: cargo test --release -p hir-ty -p hir-def -p parser -p syntax -p rustd
        if: matrix.backend == 'cranelift'
      - run: cargo build -p rustd --release --features llvm
      - name: Harnesses
        working-directory: harness
        run: |
          export RUSTD_BIN="$GITHUB_WORKSPACE/target/release/rustd"
          failed=
          run() { echo "::group::$*"; python3 "$@" || { failed="$failed [$*]"; echo "::error::$* failed"; }; echo "::endgroup::"; }
          run difftest.py corpus --bin runner --crate cases --layouts
          run programs.py
          run stress.py
          run breakers.py
          run unwinds.py
          run splices.py
          run asmedits.py
          run includes.py
          run worktrees.py
          run worktrees.py --join --together
          run worktrees.py --overlay
          run keys.py
          echo "failed:${failed:- none}"
          test -z "$failed"
