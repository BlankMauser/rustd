# The source pane of the pages: `dioxus-code-editor`, which rustc builds (`build-editor.sh`).
[package]
name = "editor"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
dioxus = { version = "0.7.9", features = ["web"] }
dioxus-code = { version = "0.1", features = ["runtime"] }
dioxus-code-editor = "0.1"
futures-channel = "0.3"
futures-util = "0.3"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
