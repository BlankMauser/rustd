<!doctype html>
<meta charset="utf-8" />
<title>rustd in the browser</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template: auto 1fr auto / 1fr 1fr; background: #14161b; color: #d8dbe2;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  textarea { background: #1b1e25; color: inherit; font: inherit; border: 0; padding: 12px;
    resize: none; outline: none; tab-size: 4; white-space: pre; border-right: 1px solid #2c303a; }
  canvas { width: 100%; height: 100%; min-height: 0; display: block; }
  header { grid-column: 1 / 3; padding: 6px 12px; border-bottom: 1px solid #2c303a; }
  select { background: #1b1e25; color: inherit; font: inherit; border: 1px solid #2c303a;
    padding: 2px 6px; }
  #status { grid-column: 1 / 3; padding: 6px 12px; border-top: 1px solid #2c303a;
    white-space: pre-wrap; max-height: 9em; overflow: auto; }
  #status.error { color: #ff8f8f; }
</style>
<header>rustd in the browser — demo: <select id="demo"></select></header>
<textarea id="source" spellcheck="false"></textarea>
<canvas id="canvas"></canvas>
<div id="status">loading the compiler…</div>
<script type="module" src="page.js"></script>
